<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Book a Truck</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; padding-bottom: 80px; }
        .header { background-color: white; padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #ddd; font-weight: bold; font-size: 18px; }
        .container { padding: 15px; }
        .section-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; }
        
        .truck-option { display: flex; align-items: center; background: white; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
        .truck-option.selected { border: 2px solid #28a745; background: #f0fff4; }
        .truck-icon { font-size: 24px; margin-right: 15px; }
        .truck-info strong { display: block; font-size: 14px; }
        .truck-info span { font-size: 12px; color: #666; }
        
        .input-group { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ddd; }
        .input-group label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box; }
        
        .btn-green { background-color: #28a745; color: white; text-align: center; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 16px; margin-top: 20px; cursor: pointer; border: none; width: 100%; }
    </style>
</head>
<body>
    <div class="header">Book a Truck</div>
    <div class="container">
        <div class="section-title">Select Truck Type</div>
        
        <div class="truck-option selected" onclick="selectTruck(this, 'Medium Truck')">
            <div class="truck-icon">🚚</div>
            <div class="truck-info"><strong>Medium Truck</strong><span>3 - 7 Tons</span></div>
        </div>
        <div class="truck-option" onclick="selectTruck(this, 'Small Truck')">
            <div class="truck-icon">🚛</div>
            <div class="truck-info"><strong>Small Truck</strong><span>1 - 3 Tons</span></div>
        </div>
        <div class="truck-option" onclick="selectTruck(this, 'Large Truck')">
            <div class="truck-icon">🚛</div>
            <div class="truck-info"><strong>Large Truck</strong><span>7 - 10 Tons</span></div>
        </div>

        <div class="section-title" style="margin-top: 20px;">Booking Details</div>
        
        <div class="input-group">
            <label>Pickup Location</label>
            <input type="text" id="pickup" placeholder="e.g. Kampala">
        </div>
        <div class="input-group">
            <label>Destination</label>
            <input type="text" id="destination" placeholder="e.g. Entebbe">
        </div>
        <div class="input-group">
            <label>Date</label>
            <input type="date" id="date">
        </div>
        <div class="input-group">
            <label>Your Name</label>
            <input type="text" id="name" placeholder="e.g. John Doe">
        </div>
        <div class="input-group">
            <label>Phone Number</label>
            <input type="text" id="phone" placeholder="e.g. +256700000000">
        </div>

        <button class="btn-green" id="submitBtn">Request Truck</button>
    </div>

    <script>
        let selectedTruckType = "Medium Truck";

        function selectTruck(element, type) {
            document.querySelectorAll('.truck-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedTruckType = type;
        }

        document.getElementById('submitBtn').addEventListener('click', async () => {
            const pickup = document.getElementById('pickup').value;
            const destination = document.getElementById('destination').value;
            const date = document.getElementById('date').value;
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;

            if(!pickup || !destination || !date || !name || !phone) {
                alert("Please fill in all the fields.");
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.innerText = "Sending...";
            btn.style.backgroundColor = "#999";

            const bookingData = {
                customerName: name,
                customerPhone: phone,
                customerEmail: "customer@example.com",
                selectedTruck: selectedTruckType,
                offeredPrice: 200000,
                pickupLocation: pickup,
                destination: destination,
                pickupDate: date,
                cargoDescription: "General goods",
                status: "Pending"
            };

            try {
                // Use your computer's IP if testing on phone
                const response = await fetch('http://localhost:3000/api/bookings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bookingData)
                });

                if (response.ok) {
                    alert("Success! Your booking has been sent to the admin.");
                    // Clear the fields
                    document.getElementById('pickup').value = '';
                    document.getElementById('destination').value = '';
                    document.getElementById('date').value = '';
                    document.getElementById('name').value = '';
                    document.getElementById('phone').value = '';
                } else {
                    alert("Failed to save. Check server logs.");
                }
            } catch (error) {
                alert("Network error. Is your server running?");
            } finally {
                btn.innerText = "Request Truck";
                btn.style.backgroundColor = "#28a745";
            }
        });
    </script>
</body>
</html>
